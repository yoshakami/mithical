{% extends "wacca/base.html" %}
{% block title %}Wacca | Mithical{% endblock %}
{% block content %}
<div class="waifu-holder">
  <div class="waifu" id="waifu-bg"></div>
</div>
<div class="container">
  <div class="profile-name">
    <div class="profile-icon"><img id="profile-icon" alt=""></div>
    <div class="profile-box-wrapper">
      <div class="profile-box">
        <div><span class="light">Welcome back</span> <span id="profile-name"></span></div>
      </div>
    </div>
  </div>
  <div class="profile-stats">
    <div class="profile-box-wrapper">
      <div class="profile-box">
        <div class="profile-stat"><span class="light">Level</span> <span id="profile-level"></span></div>
        <div class="profile-stat"><span class="light">RP</span> <span id="profile-rp"></span></div>
        <div class="profile-stat"><span class="light">Rate</span> <span id="profile-rate"></span></div>
      </div>
    </div>
    <div id="stage-up"></div>
  </div>
  <a href="/wacca/gacha" class="gacha-link">
    <div class="gacha-link-background"></div>
    <div class="gacha-link-text">Play Wacca Gacha</div>
  </a>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/wacca/index.js"></script>
{% endblock %}
