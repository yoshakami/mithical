<div class="modal" id="settings-modal">
  <div class="modal-content card">
    <div class="card-header">
      <h2>Mithical Settings</h2>
      <button type="button" class="btn-icon" id="settings-close" aria-label="Close">
        <span class="mdi mdi-close"></span>
      </button>
    </div>
    <div class="card-body settings">
      <div class="settings-setting">
        <a href="/cards" class="btn btn-primary btn-block">Manage your cards</a>
      </div>
      <div class="settings-setting">
        <p>Version</p>
        <div class="btn-toggle" id="version-toggle">
          <button type="button" data-value="300">Reverse</button>
          <button type="button" data-value="400">Plus</button>
        </div>
      </div>
      <div class="settings-setting">
        <p>Theme</p>
        <div class="btn-toggle" id="theme-toggle">
          <button type="button" data-value="Light">Light</button>
          <button type="button" data-value="Dark">Dark</button>
          <button type="button" data-value="Oled">OLED</button>
        </div>
      </div>
      <div class="settings-setting">
        <p>Language</p>
        <select id="language-select" class="nav-select">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <div class="settings-setting">
        <label class="checkbox-row">
          <input type="checkbox" id="difficulty-internal">
          Show internal difficulty numbers
        </label>
      </div>
    </div>
  </div>
</div>
